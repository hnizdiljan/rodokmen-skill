<!doctype html>
<!-- Šablona přihlašovací stránky. Vyplňuje ji tools/export_web.py z data/web.json do public/prihlaseni.html. -->
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Přihlášení · {{NAZEV}}</title>
  <style>
    :root { --bg: #fbf8f2; --ink: #2b2620; --muted: #6e6153; --line: #e4ddd1; --accent: #8a5a2b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; padding: 16px; }
    main { width: 100%; max-width: 440px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
    h1 { font: 400 1.7rem Georgia, 'Times New Roman', serif; color: #3b2e22; margin: 0 0 0.4rem; }
    p { margin: 0.5rem 0; color: var(--muted); }
    label { display: block; margin: 1.2rem 0 0.4rem; font-weight: 600; color: var(--ink); }
    input { width: 100%; font: inherit; padding: 0.6rem 0.75rem; border: 1px solid #cfc5b6; border-radius: 8px; }
    input:focus { outline: 2px solid #efb45f; border-color: #efb45f; }
    button { margin-top: 0.9rem; width: 100%; font: inherit; font-weight: 600; padding: 0.65rem; border: 0; border-radius: 8px;
      background: #3b2e22; color: #fbf3e6; cursor: pointer; }
    button:hover { background: #5a4632; }
    .err { color: #b3261e; min-height: 1.4em; margin-top: 0.6rem; }
    .small { font-size: 0.88rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>{{NAZEV}}</h1>
    <p>{{UVOD}}</p>
    <form id="f">
      <label for="a">{{OTAZKA}}</label>
      <input id="a" name="a" autocomplete="off" autofocus required />
      <button type="submit">Vstoupit</button>
      <p class="err" id="err" role="alert"></p>
    </form>
    <p class="small">{{NAPOVEDA}}</p>
  </main>
  <script>
    // SHA-256 v čistém JS (bajty → hex) pro čisté http mimo localhost, kde prohlížeč crypto.subtle nedává.
    // Ověřuje src/lib/prihlaseni.test.ts (npm test) proti node:crypto.
    // sha256-start
    function sha256(msg) {
      var K = [
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
      var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
      var len = msg.length, total = (len + 72) & ~63;   // zpráva + bajt 0x80 + 8 bajtů délky, zarovnáno na 64
      var m = new Uint8Array(total), w = new Array(64), bits = len * 8, i, o;
      m.set(msg);
      m[len] = 0x80;
      for (i = 1; i <= 8; i++, bits = Math.floor(bits / 256)) m[total - i] = bits % 256;
      for (o = 0; o < total; o += 64) {
        for (i = 0; i < 16; i++) w[i] = m[o + 4 * i] << 24 | m[o + 4 * i + 1] << 16 | m[o + 4 * i + 2] << 8 | m[o + 4 * i + 3];
        for (i = 16; i < 64; i++) {
          var x = w[i - 15], y = w[i - 2];
          w[i] = (w[i - 16] + ((x >>> 7 | x << 25) ^ (x >>> 18 | x << 14) ^ (x >>> 3)) + w[i - 7] +
            ((y >>> 17 | y << 15) ^ (y >>> 19 | y << 13) ^ (y >>> 10))) | 0;
        }
        var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
        for (i = 0; i < 64; i++) {
          var t1 = (h + ((e >>> 6 | e << 26) ^ (e >>> 11 | e << 21) ^ (e >>> 25 | e << 7)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
          var t2 = (((a >>> 2 | a << 30) ^ (a >>> 13 | a << 19) ^ (a >>> 22 | a << 10)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
          h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
        }
        H = [H[0] + a, H[1] + b, H[2] + c, H[3] + d, H[4] + e, H[5] + f, H[6] + g, H[7] + h].map(function (n) { return n | 0; });
      }
      return H.map(function (n) { return ((n >>> 0) + 0x100000000).toString(16).slice(1); }).join('');
    }
    // sha256-end
    if (new URLSearchParams(location.search).has('spatne')) {
      document.getElementById('err').textContent = 'To není ono – zkuste to znovu.';
    }
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = document.getElementById('a').value.normalize('NFD').replace(/[̀-ͯ]/g, '')
        .toLowerCase().replace(/[^a-z0-9]/g, '');
      // Do cookie jde jen otisk odpovědi (SHA-256), ne odpověď samotná – stejný otisk má server.
      var bytes = new TextEncoder().encode('rodokmen:' + v);
      var digest = window.crypto && crypto.subtle   // crypto.subtle je jen přes https a na localhostu
        ? crypto.subtle.digest('SHA-256', bytes).then(function (buf) {
          return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
        })
        : Promise.resolve(sha256(bytes));          // čisté http (třeba náhled v domácí síti)
      digest.then(function (hash) {
        var secure = location.protocol === 'https:' ? '; Secure' : '';
        document.cookie = 'rodokmen=' + hash + '; Max-Age=31536000; Path=/; SameSite=Lax' + secure;
        // úvodní lomítka sloučit: z adresy „https://web//cizi.web“ by jinak „//cizi.web“ přesměrovalo na cizí web
        var path = location.pathname.replace(/^[\/\\]+/, '/');
        var back = path === '/prihlaseni.html' ? '/' : path + location.search;
        return fetch(back, { credentials: 'same-origin', cache: 'no-store' }).then(function (r) {
          if (r.status === 401) {
            document.getElementById('err').textContent = 'To není ono – zkuste to znovu.';
          } else {
            location.replace(back);
          }
        });
      });
    });
  </script>
</body>
</html>
